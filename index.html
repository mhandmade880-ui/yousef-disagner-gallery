<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>گالری مبلمان آینده‌گرا</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #111;
      border-bottom: 1px solid #333;
    }
    .hero {
      padding: 40px 20px;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    .placeholder {
      width: 100%;
      height: 200px;
      border: 1px dashed #555;
      border-radius: 10px;
      margin: 20px 0;
    }
    .section {
      padding: 30px 20px;
      border-bottom: 1px solid #222;
    }
    .line {
      width: 80%;
      height: 18px;
      border-bottom: 1px dashed #666;
      margin: 10px auto;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
    }
    .card {
      background: #111;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    .card .placeholder {
      height: 140px;
    }
  </style>
</head>
<body>

<header>
  <h1>Miracle Furniture Gallery</h1>
</header>

<section class="hero">
  <h2>گالری مبلمان آینده‌گرا</h2>
  <div class="line"></div>
  <div class="line"></div>
  <div class="placeholder">جای تصویر اصلی</div>
</section>

<section class="section">
  <h3>گالری</h3>
  <div class="gallery">
    <div class="card">
      <div class="placeholder">عکس ۱</div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="placeholder">عکس ۲</div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="placeholder">عکس ۳</div>
      <div class="line"></div>
      <div class="line"></div>
    </div>
  </div>
</section>

<section class="section">
  <h3>کانسپت طراحی</h3>
  <div class="line"></div>
  <div class="line"></div>
  <div class="line"></div>
</section>

<section class="section">
  <h3>تماس</h3>
  <div class="line"></div>
  <div class="line"></div>
</section>

</body>
</html>
